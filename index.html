<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الاختبار المحاكي — التحصيلي: الكيمياء | المتميزون</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b:#0b4a6d;--b2:#0e5d88;--bl:#e8f1f7;--g:#d99b14;--gl:#fdf4e2;--ok:#1d8a5b;--okl:#e6f5ee;--no:#c0392b;--nol:#fbeceb;--ink:#1d2733;--mu:#5d6b78;--ln:#d8e0e7;--bg:#f3f6f9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;font-size:17px;line-height:1.8}
bdi.m{font-family:"Segoe UI",Arial,"Helvetica Neue",sans-serif;font-size:.97em;white-space:nowrap;unicode-bidi:isolate}
sub,sup{font-size:.72em;line-height:0}
button{font-family:inherit;cursor:pointer}
.wrapc{max-width:1000px;margin:auto;padding:16px}
.brand{background:var(--b);color:#fff}
.brand .in{max-width:1000px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand img{height:46px;border-radius:6px}
.brand b{font-size:1.15rem;display:block;line-height:1.3}
.brand span{font-size:.82rem;opacity:.85}
.goldbar{height:4px;background:var(--g)}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:22px;margin-bottom:14px}
h1,h2,h3{color:var(--b);margin-top:0}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:9px 20px;font-size:1rem;font-weight:700}
.btn:hover{background:var(--b2)}
.btn.gold{background:var(--g)}
.btn.ghost{background:#fff;color:var(--b);border:1.5px solid var(--b)}
.btn.red{background:var(--no)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:5px 12px;font-size:.88rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{background:var(--b);color:#fff;padding:7px 10px;text-align:right;font-weight:500}
td{border-bottom:1px solid var(--ln);padding:7px 10px}
tr:nth-child(even) td{background:#f7f9fb}
.tw{overflow-x:auto}
.note{background:var(--gl);border-right:4px solid var(--g);border-radius:8px;padding:10px 14px;margin:10px 0}
.info{background:var(--bl);border-right:4px solid var(--b2);border-radius:8px;padding:10px 14px;margin:10px 0}
input[type=text]{width:100%;max-width:420px;padding:10px 14px;border:1.5px solid var(--ln);border-radius:8px;font-family:inherit;font-size:1rem}
label.ck{display:flex;gap:8px;align-items:center;margin:12px 0;font-weight:700}
/* exam ui */
.xbar{background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20}
.xbar .in{max-width:1000px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.xbar img{height:30px;border-radius:4px;opacity:.9}
.xbar .who{flex:1;min-width:140px;font-size:.92rem;color:var(--mu)}
.xbar .who b{color:var(--ink)}
.tmr{font-weight:800;font-size:1.25rem;background:#eef2f6;border-radius:8px;padding:2px 14px;direction:ltr;min-width:92px;text-align:center}
.tmr.w5{background:#fff3d6;color:#a36a00}.tmr.w1{background:var(--nol);color:var(--no);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.55}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pbar{height:6px;background:#e3e9ef;border-radius:4px;overflow:hidden;margin:6px 0 14px}
.pbar i{display:block;height:100%;background:var(--b2)}
.qtext{font-size:1.12rem;margin:10px 0 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:#fff;border:1.5px solid var(--ln);border-radius:8px;padding:11px 14px;margin:8px 0;font-size:1.02rem;color:var(--ink)}
.opt:hover{border-color:var(--b2)}
.opt .rd{width:22px;height:22px;flex:0 0 22px;border:2px solid #9aa9b6;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mu)}
.opt.sel{border-color:var(--b);background:var(--bl)}
.opt.sel .rd{background:var(--b);border-color:var(--b);color:#fff}
.flag{background:#fff;border:1.5px solid var(--ln);border-radius:8px;padding:5px 12px;font-size:.9rem}
.flag.on{border-color:var(--g);background:var(--gl);color:#8a5d00;font-weight:700}
.xnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--ln);padding-top:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:12px 0}
.rc{border:1.5px solid var(--ln);background:#fff;border-radius:8px;padding:6px 0;text-align:center;font-weight:700;position:relative}
.rc.an{background:var(--bl);border-color:var(--b2)}
.rc.fl::after{content:"⚑";position:absolute;top:-6px;left:4px;color:var(--g);font-size:.9rem}
.filt{display:flex;gap:6px;flex-wrap:wrap}
.filt button{border:1.5px solid var(--ln);background:#fff;border-radius:20px;padding:3px 14px}
.filt button.on{border-color:var(--b);color:var(--b);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal .card{max-width:480px;width:100%}
/* report */
.notice{border:2px solid var(--b);border-radius:14px;overflow:hidden;max-width:620px;margin:0 auto 14px;background:#fff}
.notice .nh{background:var(--b);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}
.notice .nb{padding:18px}
.big{font-size:3.2rem;font-weight:800;color:var(--b);line-height:1.1}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:10px 0}
.kpi div{background:var(--bl);border-radius:10px;padding:10px 12px;text-align:center}
.kpi b{display:block;font-size:1.5rem;color:var(--b)}
.rb{display:flex;align-items:center;gap:10px;margin:7px 0}
.rb .nm{width:260px;flex:0 0 260px;font-size:.92rem}
.rb .bar{flex:1;height:14px;background:#e3e9ef;border-radius:7px;overflow:hidden}
.rb .bar i{display:block;height:100%}
.lo{background:var(--no)}.mid{background:var(--g)}.hi{background:var(--ok)}
.pill{display:inline-block;border-radius:20px;padding:0 10px;font-size:.82rem;font-weight:700}
.pill.lo{background:var(--nol);color:var(--no)}.pill.mid{background:var(--gl);color:#8a5d00}.pill.hi{background:var(--okl);color:var(--ok)}
.rv{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:8px 0}
.rv.ok{border-right:5px solid var(--ok)}.rv.no{border-right:5px solid var(--no)}.rv.sk{border-right:5px solid #9aa9b6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two ul{margin:4px 0;padding-right:18px}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:18px}
footer a{color:var(--b);text-decoration:none}
@media (max-width:760px){.rb .nm{width:130px;flex-basis:130px}.two{grid-template-columns:1fr}.card{padding:16px}.big{font-size:2.5rem}}
@media print{.noprint,.xbar,.brand .btn{display:none!important}body{background:#fff}.card{border:0;padding:6px 0;break-inside:avoid}}
</style>
</head>

 const strong=UN.filter(u=>R.byU[u.n]&&R.byU[u.n].c/R.byU[u.n].n>=.75),weak=UN.filter(u=>R.byU[u.n]&&R.byU[u.n].c/R.byU[u.n].n<.5);
 h+=`<div class="card two"><div><h3 style="color:var(--ok)">نقاط القوة (النجاحات)</h3><ul>${strong.map(u=>`<li>${u.t} (${R.byU[u.n].c}/${R.byU[u.n].n})</li>`).join('')||'<li>لا يوجد باب تجاوزت فيه 75% بعد.</li>'}</ul></div><div><h3 style="color:var(--no)">نقاط الضعف (الإخفاقات)</h3><ul>${weak.map(u=>`<li>${u.t} (${R.byU[u.n].c}/${R.byU[u.n].n})</li>`).join('')||'<li>لا يوجد باب أقل من 50%. أحسنت!</li>'}</ul></div></div>`;
 // focus plan
 const focus=skills.filter(s=>s.r<1).map(s=>({...s,score:(1-s.r)*W[s.u]})).sort((a,b)=>b.score-a.score).slice(0,8);
 h+=`<div class="card"><h3>${MODE=='pre'?'على ماذا تركز خلال الدورة؟':'خطة المراجعة قبل الاختبار'}</h3><p style="margin-top:0;color:var(--mu)">مرتبة حسب (نسبة الخطأ × وزن الباب). ارجع إلى الدرس المذكور في الدورة وفي الدليل الشامل.</p>
 <div class="tw"><table><thead><tr><th>#</th><th>الدرس</th><th>الباب</th><th>صفحة الدليل</th><th>نتيجتك</th></tr></thead><tbody>${focus.map((s,i)=>`<tr><td>${i+1}</td><td><b>${s.l}</b>. ${LS[s.l].t}</td><td>${UN.find(u=>u.n==s.u).t}</td><td>${LS[s.l].p}</td><td>${s.c}/${s.n}</td></tr>`).join('')||'<tr><td colspan="5">إجاباتك كلها صحيحة — راجع الملخصات وحافظ على الإيقاع.</td></tr>'}</tbody></table></div>
 ${MODE=='sim'?`<div class="note"><b>نصائح ليوم الاختبار:</b> نم مبكرًا، واحضر قبل الموعد بإثبات هوية ساري، وابدأ كل قسم بالأسئلة السهلة، ولا تترك سؤالًا بلا إجابة (لا درجة سالبة)، وحوّل إلى مولات واختصر قبل الضرب في المسائل، وراقب الكلمات المفتاحية «دائمًا» و«فقط» و«لا».</div>`:''}</div>`;
 // time management
 const long=R.rows.filter(r=>r.time>120);
 h+=`<div class="card"><h3>تحليل إدارة الوقت</h3><div class="tw"><table><thead><tr><th>القسم</th><th>الزمن المستغرق</th><th>المتروكة</th><th>انتهى الوقت قبل الإكمال؟</th></tr></thead><tbody>${A.secs.map((S,i)=>`<tr><td>القسم ${i+1}</td><td>${fsec(S.spent)} من ${MIN} د</td><td>${S.qs.filter(q=>q.ans==null).length}</td><td>${S.timeout?'نعم':'لا'}</td></tr>`).join('')}</tbody></table></div>
 <p>متوسط زمنك للسؤال: <b>${fsec(R.rows.reduce((s,r)=>s+r.time,0)/R.rows.length)}</b> (الإيقاع الرسمي نحو 68 ثانية). الأسئلة التي تجاوزت دقيقتين: <b>${long.length}</b>${long.length?' — أرقامها: '+long.map(r=>`ق${r.si+1}/${r.k+1}`).join('، '):''}.</p></div>`;
 // comparison
 if(prevs.length||MODE=='sim'){
  const pre=MODE=='sim'?st.getx('mtz_chem_pre_hist',[])[0]:null;
  h+=`<div class="card"><h3>المقارنة بالمحاولات السابقة</h3>`;
  if(prevs.length)h+=`<div class="tw"><table><thead><tr><th>المحاولة</th><th>التاريخ</th><th>الدرجة</th><th>الفرق عن الحالية</th></tr></thead><tbody>${prevs.slice(0,6).map((p,i)=>`<tr><td>${i+2}</td><td>${new Date(p.date).toLocaleDateString('ar-SA')}</td><td>${P(p.pct)}</td><td>${R.pct-p.pct>=0?'+':''}${R.pct-p.pct}</td></tr>`).join('')}</tbody></table></div>`;
  else if(MODE=='pre')h+='<p>هذه أول محاولة على هذا الجهاز.</p>';
  if(MODE=='sim'){if(pre){h+=`<h4>التحسن مقارنة بالاختبار القبلي (${new Date(pre.date).toLocaleDateString('ar-SA')} — ${P(pre.pct)})</h4>`+UN.map(u=>{const v=R.byU[u.n];if(!v||pre.pu[u.n]==null)return '';const now=Math.round(v.c/v.n*100),d=now-pre.pu[u.n];return `<div class="rb"><span class="nm">${u.t}</span><div class="bar"><i class="${cls(now/100)}" style="width:${Math.max(3,now)}%"></i></div><small dir="ltr">${d>=0?'+':''}${d}</small></div>`}).join('')}else h+='<p style="color:var(--mu)">لا توجد نتيجة اختبار قبلي على هذا الجهاز للمقارنة. إذا أديت الاختبار القبلي على الجهاز نفسه والمتصفح نفسه ستظهر المقارنة هنا.</p>'}
  h+='</div>';
 }
 // review
 h+=`<div class="card"><h3>مراجعة الإجابات</h3><div class="filt noprint">${[['no','الخاطئة'],['sk','المتروكة'],['ok','الصحيحة'],['all','الكل']].map(f=>`<button data-f="${f[0]}" class="${RVF==f[0]?'on':''}">${f[1]}</button>`).join('')}</div><div id="rvl"></div></div>`;
 h+=`<div class="card noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" id="again">${MODE=='pre'?'إعادة الاختبار بأسئلة جديدة':'اختبار محاكٍ جديد'}</button><button class="btn ghost" onclick="window.print()">طباعة / حفظ PDF</button></div></div>`;
 app.innerHTML=h;
 const drawRv=()=>{const L=R.rows.filter(r=>RVF=='all'||(RVF=='ok'&&r.ok)||(RVF=='sk'&&r.sk)||(RVF=='no'&&!r.ok&&!r.sk));
  $('#rvl').innerHTML=L.map(r=>{const d=QI[r.id];return `<div class="rv ${r.ok?'ok':r.sk?'sk':'no'}"><small style="color:var(--mu)">القسم ${r.si+1} • السؤال ${r.k+1} • الدرس ${r.l}: ${LS[r.l].t} (الدليل ص ${LS[r.l].p})</small><div>${d.q}</div><div>إجابتك: ${r.sk?'<b>لم تُجب</b>':'<b>'+d.o[r.ans]+'</b>'} ${r.ok?'✓':''}</div>${r.ok?'':`<div style="color:var(--ok)">الإجابة الصحيحة: <b>${d.o[d.a]}</b></div>`}</div>`}).join('')||'<p>لا توجد أسئلة في هذا التصنيف.</p>'};
 drawRv();app.querySelectorAll('.filt button').forEach(b=>b.onclick=()=>{RVF=b.dataset.f;app.querySelectorAll('.filt button').forEach(x=>x.classList.toggle('on',x==b));drawRv()});
 $('#again').onclick=()=>{A=null;st.del('cur');home();window.scrollTo(0,0)};
 window.scrollTo(0,0);
}
window.addEventListener('beforeunload',()=>{if(A&&A.phase=='q'){acc();save()}});
if(A&&A.phase=='report')report();else home();
</script>
</body>
</html>
